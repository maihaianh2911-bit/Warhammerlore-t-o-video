name: Video lore Warhammer 40K
description: Dán kịch bản tiếng Việt đã duyệt → video dọc tiếng Đức có giọng ww40k, hình và phụ đề chạy theo giọng
title: "[40K] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Cách dùng:** đặt tên video sau `[40K]`, dán kịch bản rồi bấm **Create**. Không cần chuẩn bị hình: Claude dịch sang tiếng Đức, máy tạo giọng đọc và tìm hình, Claude chọn hình cho từng ý, máy dựng video, Claude kiểm tra lại từng cảnh. Link video hiện ở bình luận cuối.
        Muốn sửa gì thì viết một bình luận (ví dụ "cảnh 3 đổi hình khác", "câu 5 đọc sai tên").
  - type: textarea
    id: script
    attributes:
      label: Kịch bản (bắt buộc)
      description: Tiếng Việt (Claude dịch sát sang tiếng Đức) hoặc tiếng Đức (giữ nguyên lời).
    validations:
      required: true
  - type: textarea
    id: pictures
    attributes:
      label: Hình riêng (không bắt buộc)
      description: Để trống thì máy và Claude tự tìm hình. Nếu có hình riêng muốn dùng thì kéo thả vào đây, kèm tên họa sĩ nếu biết.
  - type: textarea
    id: notes
    attributes:
      label: Ghi chú (không bắt buộc)
      description: Không khí, nhân vật cần xuất hiện, hình nên tránh…
