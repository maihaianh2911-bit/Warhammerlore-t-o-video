name: Dọn video cũ (nhánh renders)

# Mỗi tuần: giữ file của các phiếu hoạt động trong KEEP_DAYS ngày gần đây (lore/<số phiếu>/) và của mọi phiếu
# đang mở mà chưa xong (chưa có nhãn lore-done), xóa file của phiếu cũ hơn, và thay lịch sử nhánh renders bằng
# một commit duy nhất để GitHub dọn dung lượng cũ. Link tải của video cũ hơn KEEP_DAYS ngày sẽ hết hiệu lực.
# Không còn gì để giữ, không có gì để xóa, hoặc chưa có nhánh renders: lượt chạy vẫn xanh.
on:
  schedule:
    - cron: '17 20 * * 0'   # Chủ nhật 20:17 UTC = thứ Hai 3:17 sáng giờ VN
  workflow_dispatch:
    inputs:
      keep_days:
        description: Giữ video của phiếu hoạt động trong bao nhiêu ngày gần đây
        default: '14'

permissions:
  contents: write
  issues: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04   # chốt phiên bản: ubuntu-latest đang chuyển sang 26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_DAYS: ${{ inputs.keep_days || '14' }}
    steps:
      - name: Lấy nhánh renders
        run: |
          git init -q r && cd r
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          RC=0; git ls-remote --exit-code --heads origin renders > /dev/null || RC=$?
          if [ "$RC" = 2 ]; then   # chưa có video nào: không có gì để dọn
            echo "Chưa có nhánh renders, không có gì để dọn."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          [ "$RC" = 0 ] || exit "$RC"
          git fetch -q --depth 1 origin renders
          git checkout -q FETCH_HEAD
          git rev-parse FETCH_HEAD > ../old_sha
          du -sh --exclude=.git .
      - name: Xóa file của video cũ
        if: env.SKIP != '1'
        working-directory: r
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime, shutil
          keep = int(os.environ['KEEP_DAYS'])
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=keep)
          repo = os.environ['GITHUB_REPOSITORY']
          cache = {}
          def recent(n):
              if n not in cache:
                  r = subprocess.run(['gh', 'api', f'repos/{repo}/issues/{n}'], capture_output=True, text=True)
                  try:
                      issue = json.loads(r.stdout) if r.returncode == 0 else None
                      labels = [label['name'] for label in issue['labels']]
                      t = datetime.datetime.fromisoformat(issue['updated_at'].replace('Z', '+00:00'))
                      # phiếu đang mở mà chưa xong: giọng đọc (đã trả tiền) và hình vẫn còn cần
                      cache[n] = t >= cutoff or (issue['state'] == 'open' and 'lore-done' not in labels)
                  except (TypeError, KeyError, ValueError):
                      cache[n] = True   # không đọc được phiếu → giữ cho an toàn
              return cache[n]
          removed = 0
          if os.path.isdir('lore'):   # videos: lore/<issue>/
              for d in sorted(os.listdir('lore')):
                  if d.isdigit() and not recent(int(d)):
                      shutil.rmtree(os.path.join('lore', d)); removed += 1
          print(f'removed {removed} folders; kept issues active in the last {keep} days and open issues that are not done')
          PY
          du -sh --exclude=.git .
      - name: Thay lịch sử nhánh renders bằng một commit
        if: env.SKIP != '1'
        working-directory: r
        run: |
          git checkout -q --orphan fresh
          git add -A
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -q --allow-empty -m "renders: giữ video $KEEP_DAYS ngày gần đây ($(date -u +%F))"   # --allow-empty: không còn video nào cũng không lỗi
          git push --force-with-lease=renders:$(cat ../old_sha) origin fresh:renders
