name: Video 40K

# One issue "[40K] …" = one vertical lore short. The owner opens the issue → Claude writes lore/<N>/script.json
# (German narration) → this workflow reads the voice (VN11, one take), times it with Whisper and collects pictures
# (40K Gallery catalogue, ArtStation, Warhammer 40k Wiki, Wikimedia Commons, issue attachments) → Claude chooses
# the pictures (lore/<N>/picks.json) → this workflow renders → Claude checks every shot → done. An owner comment →
# Claude fixes. Claude's side: AGENT.md.
# Files: renders branch, folder lore/<N>/.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['lore/**']
  workflow_dispatch:
    inputs:
      issue:
        description: Số phiếu
        required: true
      steps:
        description: 'Bước: prepare (giọng + ảnh), search (tìm thêm ảnh), render (dựng), caption (chỉ đăng caption.txt) — cách nhau bằng dấu cách'
        default: render

permissions:
  contents: read

jobs:
  # 1) The owner opens a [40K] issue → wait for Claude's script, wake Claude now
  start:
    if: >-
      github.event_name == 'issues' && startsWith(github.event.issue.title, '[40K]')
      && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận phiếu và gọi Claude
        # the comment is written by wake_claude.sh: it says what happens next only when Claude was really called
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$N" --add-label lore,lore-plan
          bash scripts/wake_claude.sh "Phiếu 40K mới số $N." "$N" \
            "🤖 Đã nhận kịch bản. Các bước: dịch sang tiếng Đức và chia câu (Claude), tạo giọng đọc và tìm hình (máy), chọn hình cho từng ý (Claude), dựng video (máy), kiểm tra lại từng cảnh (Claude). Mỗi bước xong sẽ báo ở đây." \
            "Claude bắt đầu ngay."

  # 2) The owner comments on a video issue → Claude reads it and fixes
  fix:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.state == 'open'
      && !github.event.issue.pull_request
      && contains(github.event.issue.labels.*.name, 'lore')
      && github.event.comment.user.login == github.repository_owner
      && !startsWith(github.event.comment.body, '🤖')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Nhận yêu cầu sửa và gọi Claude
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$N" --add-label lore-fix --remove-label lore-done || true
          bash scripts/wake_claude.sh "Chủ kênh yêu cầu sửa phiếu 40K số $N." "$N" \
            "🤖 Đã nhận yêu cầu." "Claude sẽ sửa và máy dựng lại."

  # 3) Claude pushed lore/<N>/… (or a manual run) → which issues and steps; their step label moves at once
  plan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      todo: ${{ steps.todo.outputs.todo }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BEFORE: ${{ github.event.before }}
      IN_ISSUE: ${{ inputs.issue }}
      IN_STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - name: Việc cần làm
        id: todo
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$IN_ISSUE" in ''|*[!0-9]*) echo "::error::số phiếu không hợp lệ"; exit 1;; esac
            S=""; for s in $IN_STEPS; do case "$s" in prepare|search|render|caption) S="$S $s";; esac; done
            [ -n "$S" ] || { echo "::error::không có bước hợp lệ (prepare, search, render, caption)"; exit 1; }
            echo "$IN_ISSUE$S" > /tmp/todo.txt
          else
            # files changed by this push (only the last commit's when the old head cannot be fetched)
            git fetch -q --depth 1 origin "$BEFORE" 2>/dev/null && FILES=$(git -c core.quotePath=false diff --name-only "$BEFORE" HEAD -- lore/) || FILES=$(git -c core.quotePath=false show --name-only --format= HEAD -- lore/)
            printf '%s\n' "$FILES" | python3 -m factory.run todo > /tmp/todo.txt
          fi
          cat /tmp/todo.txt
          [ -s /tmp/todo.txt ] || echo "Không có việc."
          echo "todo=$(python3 -m factory.run matrix < /tmp/todo.txt)" >> "$GITHUB_OUTPUT"
      - name: Chuyển nhãn ngay
        # before the work job queues and installs its tools (~40 s): a Claude task woken in that gap must not find
        # the issue still at lore-plan / lore-pick and do the step a second time
        run: |
          while read -r N STEPS; do
            python3 -m factory.run mark "$N" $STEPS < /dev/null || true
          done < /tmp/todo.txt

  # 4) voice + pictures, or the video: one job per issue. Jobs of the same issue run one after the other. GitHub
  # keeps only the newest waiting job of a group, so a job picks up what a replaced one would have done (a changed
  # script, a search round not searched yet: factory/run.py catch_up).
  work:
    needs: plan
    if: needs.plan.outputs.todo != '' && needs.plan.outputs.todo != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.todo) }}
    concurrency:
      group: lore-issue-${{ matrix.job.n }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VN11_API_KEY: ${{ secrets.VN11_API_KEY || secrets.VOICE }}
      CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
      CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
      PYTHONUNBUFFERED: '1'
      N: ${{ matrix.job.n }}
      STEPS: ${{ matrix.job.steps }}
    steps:
      - uses: actions/checkout@v4
      - name: Bộ nhớ đệm công cụ
        # pip downloads and the Whisper model: saves about a minute per run; a miss only means downloading again
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: lore-tools-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Cài công cụ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check -r requirements.txt -r requirements-voice.txt
      - name: Chạy
        run: python3 -m factory.run "$N" $STEPS < /dev/null
      - name: Báo lỗi
        # a step failed, the job timed out or was cancelled: no issue may stay in lore-voice / lore-render
        if: failure() || cancelled()
        run: |
          gh issue edit "$N" --add-label lore-failed || true
          gh issue edit "$N" --remove-label lore-voice --remove-label lore-render || true
          # the reason factory.run gave, when it stopped by itself (for example a voice that does not match)
          REASON=$(head -c 700 "$RUNNER_TEMP/lore-error.txt" 2>/dev/null || true)
          bash scripts/wake_claude.sh "Phiếu 40K số $N bị lỗi ở bước $STEPS." "$N" \
            "🤖 Máy gặp lỗi ở bước \`$STEPS\`${REASON:+: $REASON} — xem nhật ký: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ." \
            "Claude sẽ xem và sửa." || true
