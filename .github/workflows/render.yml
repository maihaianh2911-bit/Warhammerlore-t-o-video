name: Dựng video 40K

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Số Issue đã duyệt. Để trống để chạy mẫu kiểm tra.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/render.yml'
      - 'factory/**'
      - 'art/**'
      - 'examples/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-voice.txt'
      - 'requirements-translation.txt'

permissions:
  contents: read

jobs:
  render:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[40K]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      issues: read
    outputs:
      issue: ${{ steps.intake.outputs.issue }}
      artifact: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kiểm tra kết nối với giọng ww40k
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.issue_number == '')
        shell: bash
        env:
          VN11_API_KEY: ${{ secrets.VN11_API_KEY || secrets.VOICE }}
        run: |
          if [[ -z "$VN11_API_KEY" ]]; then
            echo "::notice::Repo 40K chưa có secret VN11_API_KEY hoặc VOICE."
            echo "Chưa xác nhận giọng ww40k vì thiếu secret VN11_API_KEY hoặc VOICE." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -m factory.vn11 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cài công cụ dựng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/factory"
          "$RUNNER_TEMP/factory/bin/pip" install --disable-pip-version-check -r requirements.txt
      - name: Đọc kịch bản
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == issues ]]; then
            source="$GITHUB_EVENT_PATH"
            issue="$EVENT_ISSUE"
          elif [[ -n "$INPUT_ISSUE" ]]; then
            [[ "$INPUT_ISSUE" =~ ^[1-9][0-9]*$ ]]
            issue="$INPUT_ISSUE"
            source="$RUNNER_TEMP/issue.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > "$source"
          else
            exit 0
          fi
          "$RUNNER_TEMP/factory/bin/python" -m factory.intake --issue "$source" \
            --owner "$GITHUB_REPOSITORY_OWNER" --script "$RUNNER_TEMP/script.txt" > "$RUNNER_TEMP/title.txt"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
      - name: Cài công cụ dịch
        if: steps.intake.outputs.issue == '' || vars.NARRATION_LANGUAGE == '' || vars.NARRATION_LANGUAGE == 'de'
        run: "$RUNNER_TEMP/factory/bin/pip install --disable-pip-version-check -r requirements-translation.txt"
      - name: Dịch và kiểm tra bản dựng mẫu
        if: steps.intake.outputs.issue == ''
        run: |
          "$RUNNER_TEMP/factory/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/factory/bin/python" -m factory.translate --title 'Ai xuất hiện trong đoạn mở đầu?' \
            --script examples/translation-smoke.txt --out "$RUNNER_TEMP/translated"
          cat "$RUNNER_TEMP/translated/script.txt"
          "$RUNNER_TEMP/factory/bin/python" -c 'import sys; from pathlib import Path; from factory.translate import language_of; sys.exit(language_of(Path(sys.argv[1]).read_text()) != "de")' "$RUNNER_TEMP/translated/script.txt"
          "$RUNNER_TEMP/factory/bin/python" -c 'import re, sys; from pathlib import Path; count = lambda path: len(re.findall(r"[.!?](?:\s|$)", Path(path).read_text())); sys.exit(count(sys.argv[1]) != count(sys.argv[2]))' examples/translation-smoke.txt "$RUNNER_TEMP/translated/script.txt"
          for name in Slaanesh Tzeentch Nurgle Khorne; do
            grep -qiF "$name" "$RUNNER_TEMP/translated/script.txt"
          done
          "$RUNNER_TEMP/factory/bin/python" -m factory.render --title="$(cat "$RUNNER_TEMP/translated/title.txt")" \
            --script "$RUNNER_TEMP/translated/script.txt" --out out --language de --voice espeak --size preview
          cp "$RUNNER_TEMP/translated/script.txt" out/script-de.txt
          cp "$RUNNER_TEMP/translated/title.txt" out/title-de.txt
          test -s out/video.mp4
          test -s out/subtitles.srt
          jq -e '.scenes[1].layout == "horizontal_pan"' out/scenes.json
          ffprobe -v error -show_entries stream=codec_type,width,height -of json out/video.mp4
      - name: Chuẩn bị bản lời đọc
        if: steps.intake.outputs.issue != ''
        env:
          NARRATION_LANGUAGE: ${{ vars.NARRATION_LANGUAGE }}
        run: |
          "$RUNNER_TEMP/factory/bin/python" -m factory.translate --title="$(cat "$RUNNER_TEMP/title.txt")" \
            --script "$RUNNER_TEMP/script.txt" --out "$RUNNER_TEMP/translated" --target "${NARRATION_LANGUAGE:-de}"
      - name: Dựng kịch bản đã duyệt
        if: steps.intake.outputs.issue != ''
        env:
          VN11_API_KEY: ${{ secrets.VN11_API_KEY || secrets.VOICE }}
          NARRATION_LANGUAGE: ${{ vars.NARRATION_LANGUAGE }}
        run: |
          if [[ -z "$VN11_API_KEY" ]]; then
            echo "::error::Cần secret VN11_API_KEY hoặc VOICE để dùng giọng ww40k."
            exit 1
          fi
          "$RUNNER_TEMP/factory/bin/pip" install --disable-pip-version-check -r requirements-voice.txt
          language="${NARRATION_LANGUAGE:-de}"
          "$RUNNER_TEMP/factory/bin/python" -m factory.render --title="$(cat "$RUNNER_TEMP/translated/title.txt")" \
            --script "$RUNNER_TEMP/translated/script.txt" --out out --language "$language" --voice vn11
          cp "$RUNNER_TEMP/translated/script.txt" "out/script-$language.txt"
          cp "$RUNNER_TEMP/translated/title.txt" "out/title-$language.txt"
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: 40k-video-${{ steps.intake.outputs.issue || 'demo' }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  reply:
    needs: render
    if: always() && !cancelled() && needs.render.outputs.issue != ''
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Trả video về Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.render.outputs.issue }}
          ARTIFACT: ${{ needs.render.outputs.artifact }}
          RESULT: ${{ needs.render.result }}
        run: |
          if [[ "$RESULT" == success ]]; then
            message="🤖 Đã dựng xong. [Tải video, phụ đề và nguồn hình]($ARTIFACT)."
          else
            message="🤖 Lượt dựng dừng giữa chừng. [Xem bước gặp lỗi]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$message"
